[project]
name = "mcp-elasticsearch"
version = "0.1.0"
description = "An Elasticsearch MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=0.1.0",
    "elasticsearch>=8.0.0"
]

[project.scripts]
mcp-elasticsearch = "mcp_elasticsearch.server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_elasticsearch"]
