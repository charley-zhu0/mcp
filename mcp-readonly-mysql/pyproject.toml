[project]
name = "mcp-readonly-mysql"
version = "0.1.0"
description = "A read-only MySQL MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=0.1.0",
    "mysql-connector-python>=8.0.0"
]

[project.scripts]
mcp-readonly-mysql = "mcp_readonly_mysql.server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_readonly_mysql"]
